<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALPHA CLASH PRO</title>
    <!-- Tailwind and daisy UI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.7.1/dist/full.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- custom css -->
    <link rel="stylesheet" href="styles/style.css" />
  </head>

  <body class="font-poppins">
    <main
      class="min-h-screen px-4 bg-[#010313] bg-[url(images/background.png)] bg-no-repeat bg-center bg-cover"
    >
      <!-- Home screen  -->
      <section
        id="home-screen"
        class="min-h-screen text-white flex justify-center flex-col items-center"
      >
        <div class="flex flex-col items-center gap-10">
          <h1
            class="font-anton uppercase text-4xl sm:text-6xl md:text-8xl lg:text-9xl text-center"
          >
            Alpha clash Pro
          </h1>
          <p class="text-center text-base sm:text-lg md:text-2xl max-w-xl">
            Unleash Your Keyboard Kung Fu : Press “Enter” to Play
          </p>
          <button
            onclick="play()"
            class="btn bg-white text-black text-lg sm:text-xl md:text-2xl"
          >
            Play Now
          </button>
        </div>
      </section>
      <!-- Playground start -->
      <section id="play-ground" class="hidden px-4">
        <div class="flex flex-col items-center gap-10 md:gap-20 pt-10 md:pt-20">
          <!-- screen -->
          <div
            class="artboard w-full max-w-md md:max-w-lg lg:max-w-xl border-[12px] md:border-[20px] rounded-2xl border-[#010313CC] bg-[#FFFFFFB3]"
          >
            <div class="flex justify-center">
              <p
                class="bg-[#2F2941] px-3 sm:px-4 py-2 sm:py-3 rounded-b-xl text-white text-xs sm:text-sm md:text-base text-center"
              >
                Don't watch keyboard while playing...
              </p>
            </div>
            <div class="flex justify-center items-center h-full">
              <p
                id="current-alphabet"
                class="text-black font-bold uppercase text-6xl sm:text-7xl md:text-8xl lg:text-9xl transition-all duration-200"
              >
                Y
              </p>
            </div>
          </div>
          <!-- keyboard start -->
          <div class="">
            <div class="flex flex-wrap justify-center gap-2 my-1 w-full">
              <kbd id="w" class="kbd text-xs sm:text-sm md:text-base">w</kbd>
              <kbd id="q" class="kbd text-xs sm:text-sm md:text-base">q</kbd>
              <kbd id="e" class="kbd text-xs sm:text-sm md:text-base">e</kbd>
              <kbd id="r" class="kbd text-xs sm:text-sm md:text-base">r</kbd>
              <kbd id="t" class="kbd text-xs sm:text-sm md:text-base">t</kbd>
              <kbd id="y" class="kbd text-xs sm:text-sm md:text-base">y</kbd>
              <kbd id="u" class="kbd text-xs sm:text-sm md:text-base">u</kbd>
              <kbd id="i" class="kbd text-xs sm:text-sm md:text-base">i</kbd>
              <kbd id="o" class="kbd text-xs sm:text-sm md:text-base">o</kbd>
              <kbd id="p" class="kbd text-xs sm:text-sm md:text-base">p</kbd>
            </div>
            <div class="flex justify-center gap-1 my-1 w-full">
              <kbd id="a" class="kbd text-xs sm:text-sm md:text-base">a</kbd>
              <kbd id="s" class="kbd text-xs sm:text-sm md:text-base">s</kbd>
              <kbd id="d" class="kbd text-xs sm:text-sm md:text-base">d</kbd>
              <kbd id="f" class="kbd text-xs sm:text-sm md:text-base">f</kbd>
              <kbd id="g" class="kbd text-xs sm:text-sm md:text-base">g</kbd>
              <kbd id="h" class="kbd text-xs sm:text-sm md:text-base">h</kbd>
              <kbd id="j" class="kbd text-xs sm:text-sm md:text-base">j</kbd>
              <kbd id="k" class="kbd text-xs sm:text-sm md:text-base">k</kbd>
              <kbd id="l" class="kbd text-xs sm:text-sm md:text-base">l</kbd>
            </div>
            <div class="flex justify-center gap-1 my-1 w-full">
              <kbd id="z" class="kbd text-xs sm:text-sm md:text-base">z</kbd>
              <kbd id="x" class="kbd text-xs sm:text-sm md:text-base">x</kbd>
              <kbd id="c" class="kbd text-xs sm:text-sm md:text-base">c</kbd>
              <kbd id="v" class="kbd text-xs sm:text-sm md:text-base">v</kbd>
              <kbd id="b" class="kbd text-xs sm:text-sm md:text-base">b</kbd>
              <kbd id="n" class="kbd text-xs sm:text-sm md:text-base">n</kbd>
              <kbd id="m" class="kbd text-xs sm:text-sm md:text-base">m</kbd>
              <kbd id="/" class="kbd text-xs sm:text-sm md:text-base">/</kbd>
            </div>
          </div>
          <!-- keyboard end -->
          <!-- life score -->
          <div class="flex justify-between w-full max-w-md px-4">
            <!-- display life -->
            <button
              class="btn rounded-full text-white bg-[#894189] px-3 sm:px-4 text-sm sm:text-base"
            >
              <span>Life</span>
              <img src="images/heart.svg" alt="" />
              <span id="current-life">5</span>
            </button>
            <!-- display score -->
            <button class="btn rounded-full text-white bg-[#360490] px-4">
              <span>Score</span>
              <img src="images/dolar.svg" alt="" />
              <span id="current-score">0</span>
            </button>
          </div>
        </div>
      </section>
      <!-- Playground end -->

      <!-- Final score start -->
      <section
        id="final-score"
        class="flex justify-center items-center min-h-screen hidden"
      >
        <div
          class="text-white text-center space-y-6 bg-[#FFFFFF33] p-8 rounded-2xl"
        >
          <h4 class="text-3xl">Game Over !</h4>
          <h1 class="text-5xl sm:text-6xl md:text-8xl">
            <span class="font-extrabold">Score:</span>
            <span id="last-score">14</span>
          </h1>
          <button
            onclick="play()"
            class="btn bg-white text-2xl text-black text-xl"
          >
            Play Again
          </button>
          <p>Practice will make you pro</p>
        </div>
      </section>
    </main>
    <script src="script/utility.js"></script>
    <script src="script/alpha-clash.js"></script>
  </body>
</html>
